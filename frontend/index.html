<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>町の地図 | ともはね β版</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/playground.css">
  <link rel="stylesheet" href="/shared/customize.css">
  <link rel="stylesheet" href="/shared/network.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" id="header"></header>
  <main class="page">
    <h1 class="sr-only">ともはねの町</h1>
    <!-- 町の地図：真ん中が広場、まわりにキャラの家とガレージ -->
    <div class="town-map" id="town-map" aria-label="町の地図">
      <div class="road road-h" aria-hidden="true"></div>
      <div class="road road-v" aria-hidden="true"></div>
      <a class="plaza-spot" href="/plaza.html">
        <span class="plaza-title">💬 広場</span>
        <span class="plaza-latest" id="plaza-latest">みんなのおしゃべり</span>
      </a>
      <div id="map-houses"></div>
      <!-- やりくり献立のお店（このパソコンのやりくり献立アプリにつながる） -->
      <a class="kondate-shop" id="kondate-shop" href="http://localhost:8501/" target="_blank" rel="noopener">
        <span class="shop-awning" aria-hidden="true"></span>
        <span class="shop-name">🍚 やりくり献立</span>
        <span class="shop-today" id="kondate-today">献立を作ろう</span>
      </a>
      <!-- ころとも（ラジコンの小さなロボット）：ともはねのゲームとして。ガレージのとなり -->
      <a class="korotomo-spot" href="/api/link/korotomo-start" aria-label="ころとも（ラジコンのロボットのゲームが開きます）">
        <span aria-hidden="true">🤖</span> ころとも
      </a>
      <!-- ゴーストエージェント（昨日の自分と競う）の入り口 -->
      <a class="ground-spot" href="/api/link/ghost-start" aria-label="グラウンド（ゴーストエージェントが開きます）">
        <span aria-hidden="true">👻🏃</span> グラウンド
      </a>
      <!-- 手紙キットの入り口 -->
      <a class="post-spot" href="/letter.html" aria-label="ポスト（手紙キット）">
        <span class="post-box" aria-hidden="true"></span>
        <span class="map-label">📮 ポスト</span>
      </a>
      <div class="mystery-sign" role="note" aria-label="準備中の機能"><span aria-hidden="true">？？？？</span></div>
      <!-- 2つ目のひみつ：あとで作る別のアプリ（ともはねとつなぐ）。新しいエージェントもここに来る予定 -->
      <div class="mystery-sign mystery-2" role="note" aria-label="準備中の機能（もうひとつ）"><span aria-hidden="true">？？？？</span></div>
      <!-- 3つ目のひみつ：お店のアプリ「みせとも」。名前は出さずに「？？？？」のまま、押すと開く -->
      <a class="mystery-sign mystery-3" href="/api/link/misetomo-start" aria-label="？？？？（お店のアプリ みせとも が開きます）"><span aria-hidden="true">？？？？</span></a>
    </div>
    <a class="btn oshi-cta" href="/oshi.html">💖 わたしの推しページへ</a>
  </main>
  <script type="module" src="/map.js"></script>
  <script type="module" src="/shared/customize.js"></script>
  <script type="module" src="/shared/network.js"></script>
  <script type="module" src="/shared/playground.js"></script>
</body>
</html>
