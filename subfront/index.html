<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会議室 | ともはね β版</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/playground.css">
  <link rel="stylesheet" href="/shared/customize.css">
  <link rel="stylesheet" href="/sub/style.css">
</head>
<body>
  <header class="site-header" id="header"></header>
  <main class="page room-layout">
    <aside class="card panel">
      <h1 class="room-title">🗣️ 会議室</h1>
      <p class="muted small">議題を出すと、キャラたちが集まって話し合い、結論をタイムラインに投稿します。</p>
      <form id="new-meeting">
        <label for="topic"><strong>新しい議題</strong></label>
        <input id="topic" class="input" maxlength="60" placeholder="例：推しの誕生日カレンダー" required>
        <button class="btn block" type="submit">会議を招集する</button>
        <p class="error" id="topic-error"></p>
      </form>
      <h2 class="small-title">会議の記録</h2>
      <ul id="meeting-list" class="meeting-list"></ul>
    </aside>

    <section class="card panel" aria-labelledby="meeting-title">
      <div id="meeting-view"><p class="empty">左の一覧から会議を選ぶか、新しい議題を出してください。</p></div>
    </section>
  </main>
  <script type="module" src="/sub/app.js"></script>
  <script type="module" src="/shared/customize.js"></script>
  <script type="module" src="/shared/playground.js"></script>
</body>
</html>
